
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic Similarity Evaluation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="id-input-section">
        <h2>Please enter a valid 22–24 character Prolific ID:</h2>

        <input type="text" id="participantId"
               placeholder="Enter your Prolific ID"
               pattern="[A-Za-z0-9]{22,24}"
               maxlength="24" minlength="22" required
               title="Please enter a valid Prolific ID."
               oninput="validateProlificId()">

        <br><br>
        <button id="start-btn" onclick="startTask()" disabled>
            Start
        </button>
    </div>

    <div id="main-task" style="display: none;">


        <p class="instruction" id="instruction">
        </p>

        <p id="progress"></p>
        <br><br>
        <h3>How similar is the meaning of Sentence 2 to that of Sentence 1?</h3>

        <div class="sentence-container">

            <div class="sentence-column">
                <h3>Sentence 1</h3>
                <div class="passage" id="originalSentence"></div>
            </div>
        
            <div class="sentence-column">
                <h3>Sentence 2</h3>
                <div class="passage" id="modifiedSentence"></div>
            </div>
        
        </div>

        

        <div id="rating-section">

            <label class="rating-option">
                <input type="radio" name="similarity" value="1">
                <span>Different meaning</span>
            </label>

            <label class="rating-option">
                <input type="radio" name="similarity" value="2">
                <span>Mostly different</span>
            </label>

            <label class="rating-option">
                <input type="radio" name="similarity" value="3">
                <span>Mostly the same</span>
            </label>

            <label class="rating-option">
                <input type="radio" name="similarity" value="4">
                <span>Same meaning</span>
            </label>

        </div>


        <div class="explanation-section">
            <label for="explanation">
                Why did you choose this rating? (Optional)
            </label>
            <textarea id="explanation"
                    placeholder="Explain your reason here..."></textarea>
        </div>

        <button id="next" disabled>Continue</button>

    </div>

    
    <div id="completion-section" style="display: none;">
        <h2>Thank you for completing the study!</h2>
        
    </div>

    <script src="content.js"></script>

    <script>
        const STORAGE_KEY = "semanticSimilarityStudy";

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyox4-2564wefTMowcPGCmLZyX2pY8xgxfghhD4m1jTYreQVHs3KTBGoWQRExQKQevK1w/exec";

        function getStudy() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY));
        }

        function setStudy(study) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(study));
        }

        function validateProlificId() {
            const input = document.getElementById("participantId")
                .value.trim();

            const isValid = /^[A-Za-z0-9]{22,24}$/.test(input);

            document.getElementById("start-btn").disabled = !isValid;
        }

        function shuffle(array) {
            const result = [...array];

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }

        
        function startTask() {
            const prolificId = document.getElementById("participantId")
                .value.trim();

            if (!/^[A-Za-z0-9]{22,24}$/.test(prolificId)) {
                return;
            }

            const fixedIds = [4, 10, 16, 93, 94];

            const excludedIds = [4, 10, 16, 93, 94, 9];

            const availableIds = SENTENCE_PAIRS
                .map(p => p.id)
                .filter(id => !excludedIds.includes(id));

            const randomIds = shuffle(availableIds).slice(0, 15);

            const selectedIds = shuffle([...fixedIds, ...randomIds]);

            const study = {
                prolificId: prolificId,
                order: selectedIds,
                pairIndex: 0,
                responses: [],
                start: new Date().toISOString()
            };

            setStudy(study);
            showPair();
        }


        function showPair() {
            const study = getStudy();

            if (study.pairIndex >= study.order.length) {
                finishStudy();
                return;
            }

            const id = study.order[study.pairIndex];
            const pair = SENTENCE_PAIRS.find(p => p.id === id);

            document.getElementById("id-input-section")
                .style.display = "none";

            document.getElementById("completion-section")
                .style.display = "none";

            document.getElementById("main-task")
                .style.display = "block";

            document.getElementById("progress").textContent =
                `Pair ${study.pairIndex + 1} of ${study.order.length}`;

            document.getElementById("originalSentence").textContent =
                pair.original;

            document.getElementById("modifiedSentence").textContent =
                pair.modified;

            document.getElementById("explanation").value = "";

            document.querySelectorAll(
                'input[name="similarity"]'
            ).forEach(radio => {
                radio.checked = false;
            });

            document.getElementById("next").disabled = true;

            study.currentStart = new Date().toISOString();

            setStudy(study);
        }

        document.querySelectorAll(
            'input[name="similarity"]'
        ).forEach(radio => {
            radio.addEventListener("change", function() {
                document.getElementById("next").disabled = false;
            });
        });

        document.getElementById("next").addEventListener(
            "click", function() {

                const selected = document.querySelector(
                    'input[name="similarity"]:checked'
                );

                if (!selected) return;

                const study = getStudy();

                const id = study.order[study.pairIndex];
                const pair = SENTENCE_PAIRS.find(p => p.id === id);

                const end = new Date().toISOString();

                const duration = (
                    new Date(end) - new Date(study.currentStart)
                ) / 1000;

                
            study.responses.push({
                pairId: pair.id,
                original: pair.original,
                modified: pair.modified,
                rating: Number(selected.value),
                explanation: document.getElementById("explanation").value.trim(),
                start: study.currentStart,
                end: end,
                durationSeconds: duration
            });


                study.pairIndex++;

                setStudy(study);

                if (study.pairIndex < study.order.length) {
                    showPair();
                } else {
                    finishStudy();
                }
            }
        );


        async function saveToGoogleSheets(study) {
            const formData = JSON.stringify({
                prolificId: study.prolificId,
                responses: study.responses
            });

            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: formData
            });
        }

        function finishStudy() {
            const study = getStudy();

            if (!study.end) {
                study.end = new Date().toISOString();
                setStudy(study);
            }

            document.getElementById("id-input-section")
                .style.display = "none";

            document.getElementById("main-task")
                .style.display = "none";

            document.getElementById("completion-section")
                .style.display = "block";

            if (!study.submissionAttempted) {
                study.submissionAttempted = true;
                setStudy(study);

                saveToGoogleSheets(study).catch(error => {
                    console.error("Submission error:", error);
                });
}
        }


        const existing = getStudy();

        if (existing) {
            if (existing.pairIndex >= existing.order.length) {
                finishStudy();
            } else {
                showPair();
            }
        }

    </script>

</body>
</html>
